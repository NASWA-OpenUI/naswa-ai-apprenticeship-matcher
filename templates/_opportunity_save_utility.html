<div id="opportunity-save-utility" class="detail-hero__actions" aria-label="Opportunity actions">
    <div class="detail-hero__action-buttons">
        <button type="button" class="btn btn--hero-action{% if is_saved %} btn--hero-action-saved{% endif %}"
            aria-pressed="{{ 'true' if is_saved else 'false' }}" {% if is_saved %}
            hx-delete="/saves/opportunities/{{ opportunity_id }}" {% else %}
            hx-post="/saves/opportunities/{{ opportunity_id }}" {% endif %} hx-target="#opportunity-save-utility"
            hx-swap="outerHTML" hx-disabled-elt="this">
            <svg viewBox="0 0 24 24" fill="{{ 'currentColor' if is_saved else 'none' }}" aria-hidden="true"
                focusable="false">
                <path d="M6 4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21l-6-3.5L6 21V4.5Z" stroke="currentColor"
                    stroke-width="1.8" stroke-linejoin="round" />
            </svg>

            <span>
                {% if is_saved %}
                Saved
                {% else %}
                Save
                {% endif %}
            </span>
        </button>

        {% if email_enabled %}
        <button type="button" class="btn btn--hero-action" data-modal-open="opportunity-email">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
                <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8" />
                <path d="m4 7 8 6 8-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>

            <span>Send</span>
        </button>
        {% endif %}
    </div>

    {% if save_error %}
    <p class="detail-hero__action-error" role="alert">
        {{ save_error }}
    </p>
    {% endif %}

    <p class="visually-hidden" role="status" aria-live="polite" aria-atomic="true">
        {{ status_message }}
    </p>
</div>
