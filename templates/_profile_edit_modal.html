<div class="profile-modal-backdrop" data-profile-edit-modal
    data-profile-save-mode="{{ profile_save_mode | default('local') }}" hidden>
    <div class="profile-modal" role="dialog" aria-modal="true" aria-labelledby="profile-edit-title"
        aria-describedby="profile-edit-description" tabindex="-1">
        <div class="profile-modal-head">
            <div>
                <h2 id="profile-edit-title">Edit your profile</h2>
                <p id="profile-edit-description">
                    Add or remove anything below. This is what we use to find your matches.
                </p>
            </div>

            <button type="button" class="profile-modal-close" data-profile-modal-close aria-label="Close">
                ×
            </button>
        </div>

        <div class="profile-modal-body">
            <div class="profile-edit-grid">
                <div class="profile-edit-field">
                    <label id="profile-likes-label" class="profile-edit-label">Likes</label>

                    <div class="profile-edit-chips flex-center-wrap" data-edit-list="likes" role="list"
                        aria-labelledby="profile-likes-label"></div>

                    <div class="profile-add-row">
                        <input class="form-control" type="text" data-edit-add-input aria-label="Add likes…"
                            placeholder="Add likes">
                        <button type="button" class="btn btn--outline" data-edit-add-button>Add</button>
                    </div>
                </div>

                <div class="profile-edit-field">
                    <label id="profile-dislikes-label" class="profile-edit-label">Dislikes</label>

                    <div class="profile-edit-chips flex-center-wrap" data-edit-list="dislikes" role="list"
                        aria-labelledby="profile-dislikes-label"></div>

                    <div class="profile-add-row">
                        <input class="form-control" type="text" data-edit-add-input aria-label="Add dislikes…"
                            placeholder="Add dislikes">
                        <button type="button" class="btn btn--outline" data-edit-add-button>Add</button>
                    </div>
                </div>
            </div>

            {% if match_target == "opportunities" %}
            <hr class="profile-modal-rule">

            <div class="profile-edit-field">
                <label for="profile-edit-transportation" class="profile-edit-label">
                    Transportation
                </label>
                <input id="profile-edit-transportation" class="form-control" type="text" data-edit-transportation
                    placeholder="e.g. drives self, transit">
            </div>
            {% endif %}
        </div>

        <div class="profile-modal-foot">
            <button type="button" class="btn btn--outline" data-profile-modal-close>Cancel</button>
            <button type="button" class="btn btn--filled" data-profile-save>Save changes</button>
        </div>
    </div>
</div>

<script>
    (function () {
        if (window.profileEditModalInitialized) return;
        window.profileEditModalInitialized = true;

        const focusableSelector = [
            'a[href]',
            'button:not([disabled])',
            'input:not([disabled])',
            'select:not([disabled])',
            'textarea:not([disabled])',
            '[tabindex]:not([tabindex="-1"])'
        ].join(',');

        let lastModalTrigger = null;
        let inertedElements = [];

        function getModalBackdrop() {
            return document.querySelector('[data-profile-edit-modal]');
        }

        function getModalDialog() {
            return getModalBackdrop()?.querySelector('.profile-modal');
        }

        function getProfileCard() {
            return document.querySelector('[data-profile-card], [data-profile-summary]');
        }

        function getProfileSummary() {
            return document.querySelector('[data-profile-summary]');
        }

        function getChatStatus() {
            return document.getElementById('chat-status');
        }

        function escapeHtml(value) {
            return String(value || '').replace(/[&<>"']/g, function (char) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[char];
            });
        }

        function cleanProfileList(values) {
            if (!Array.isArray(values)) return [];

            const seen = new Set();
            const cleaned = [];

            values.forEach(function (value) {
                const text = String(value || '').trim();
                const key = text.toLowerCase();

                if (!text || seen.has(key)) return;

                seen.add(key);
                cleaned.push(text);
            });

            return cleaned;
        }

        function readProfileFromCard() {
            const card = getProfileCard();
            const jsonEl = card?.querySelector('[data-profile-json]');

            if (!jsonEl) {
                return {
                    name: '',
                    likes: [],
                    dislikes: [],
                    transportation: ''
                };
            }

            try {
                const parsed = JSON.parse(jsonEl.textContent || '{}');

                return {
                    name: parsed.name || '',
                    likes: cleanProfileList(parsed.likes),
                    dislikes: cleanProfileList(parsed.dislikes),
                    transportation: parsed.transportation || ''
                };
            } catch {
                return {
                    name: '',
                    likes: [],
                    dislikes: [],
                    transportation: ''
                };
            }
        }

        function writeProfileJson(profile) {
            const card = getProfileCard();
            const jsonEl = card?.querySelector('[data-profile-json]');

            if (jsonEl) {
                jsonEl.textContent = JSON.stringify(profile);
            }
        }

        function makeProfileCardListChip(key, text) {
            const chip = document.createElement('span');
            const isDislike = key === 'dislikes';

            chip.className = [
                'chip',
                isDislike ? 'chip--danger' : 'chip--theme',
            ].join(' ');

            chip.setAttribute('role', 'listitem');
            chip.setAttribute(
                'aria-label',
                `${isDislike ? 'Avoiding' : 'Interest'}: ${text}`
            );

            const sign = document.createElement('span');
            sign.className = 'chip__sign';
            sign.setAttribute('aria-hidden', 'true');
            sign.textContent = isDislike ? '−' : '+';

            const label = document.createElement('span');
            label.textContent = text;

            chip.append(sign, label);

            return chip;
        }

        function renderCardList(key, values) {
            const card = getProfileCard();
            const target = card?.querySelector(`[data-profile-list="${key}"]`);

            if (!target) return;

            target.replaceChildren();

            if (!values.length) {
                const empty = document.createElement('span');
                empty.className = 'profile-empty';
                empty.textContent = 'None added';
                target.appendChild(empty);
                return;
            }

            values.forEach(function (value) {
                target.appendChild(makeProfileCardListChip(key, value));
            });
        }

        function makeProfileCardValueChip(key, text) {
            const chip = document.createElement('span');

            chip.className = [
                'chip',
                'chip--neutral',
                'profile-card-value-chip'
            ].join(' ');

            if (key === 'transportation') {
                chip.setAttribute('aria-label', `Transportation: ${text}`);
            }

            const label = document.createElement('span');
            label.textContent = text;
            chip.appendChild(label);

            return chip;
        }

        function renderProfileCardValue(key, rawValue) {
            const card = getProfileCard();
            const target = card?.querySelector(`[data-profile-value="${key}"]`);

            if (!target) return;

            target.replaceChildren();

            const value = String(rawValue || '').trim();

            if (!value) {
                const empty = document.createElement('span');
                empty.className = 'profile-empty';
                empty.textContent = '—';
                target.appendChild(empty);
                return;
            }

            target.appendChild(makeProfileCardValueChip(key, value));
        }

        function buildMatchesUrl(
            profile,
            target,
            demo = false
        ) {
            const params = new URLSearchParams();

            if (demo && profile.name) {
                params.set('name', profile.name);
            }

            profile.likes.forEach(function (like) {
                params.append('likes', like);
            });

            profile.dislikes.forEach(function (dislike) {
                params.append('dislikes', dislike);
            });

            if (
                target === 'opportunities' &&
                profile.transportation
            ) {
                params.set(
                    'transportation',
                    profile.transportation
                );
            }

            if (demo) {
                params.set('demo', 'true');
            }

            const path = target === 'opportunities'
                ? '/opportunities'
                : '/programs';

            const query = params.toString();

            return query ? `${path}?${query}` : path;
        }

        function buildChatUrl(profile, target) {
            const params = new URLSearchParams();

            params.set('match_target', target);

            profile.likes.forEach(function (like) {
                params.append('likes', like);
            });

            profile.dislikes.forEach(function (dislike) {
                params.append('dislikes', dislike);
            });

            if (target === 'opportunities' && profile.transportation) {
                params.set('transportation', profile.transportation);
            }

            return '/chat?' + params.toString();
        }

        function makeSummaryTag(kind, text) {
            const isDislike = kind === 'dislike';
            const tag = document.createElement('span');

            tag.className = [
                'profile-summary-tag',
                'chip',
                isDislike ? 'chip--danger' : 'chip--theme'
            ].join(' ');

            tag.setAttribute(
                'aria-label',
                `${isDislike ? 'Avoiding' : 'Interest'}: ${text}`
            );

            tag.innerHTML = `
        <span class="chip__sign" aria-hidden="true">
            ${isDislike ? '−' : '+'}
        </span>
        ${escapeHtml(text)}
    `;

            return tag;
        }

        function renderProfileSummary(profile) {
            const summary = getProfileSummary();
            if (!summary) return;

            const tags = summary.querySelector('[data-profile-summary-tags]');
            if (tags) {
                tags.replaceChildren();

                profile.likes.forEach(function (like) {
                    tags.appendChild(makeSummaryTag('like', like));
                });

                profile.dislikes.forEach(function (dislike) {
                    tags.appendChild(makeSummaryTag('dislike', dislike));
                });
            }

            const chatLink = summary.querySelector('[data-profile-chat-link]');
            if (chatLink) {
                const target = summary.dataset.matchTarget || 'programs';
                chatLink.href = buildChatUrl(profile, target);
            }
        }

        function shouldRedirectAfterProfileSave() {
            const modal = getModalBackdrop();
            return modal?.dataset.profileSaveMode === 'redirect';
        }

        function renderProfileCard(profile) {
            const card = getProfileCard();
            if (!card) return;

            renderCardList('likes', profile.likes);
            renderCardList('dislikes', profile.dislikes);

            renderProfileCardValue('transportation', profile.transportation);

            const matchesLink = card.querySelector('[data-profile-matches-link]');
            const matchTarget = card.dataset.matchTarget;
            if (matchesLink && matchTarget) {
                matchesLink.href = buildMatchesUrl(profile, matchTarget);
            }

            renderProfileSummary(profile);
            writeProfileJson(profile);
        }

        function makeEditableChip(kind, text) {
            const chip = document.createElement('span');
            const variantClass = kind === 'dislikes'
                ? 'chip--danger'
                : 'chip--theme';

            chip.className = `chip ${variantClass} profile-chip-edit`;
            chip.dataset.value = text;
            chip.setAttribute('role', 'listitem');

            chip.innerHTML = `
        <span>${escapeHtml(text)}</span>
        <button
            type="button"
            class="profile-chip-remove"
            data-edit-remove
            aria-label="Remove ${escapeHtml(text)}"
        >×</button>
    `;

            return chip;
        }

        function addEditableValues(listEl, rawValue) {
            if (!listEl || !rawValue) return;

            const kind = listEl.dataset.editList;

            rawValue
                .split(',')
                .map(function (value) {
                    return value.trim();
                })
                .filter(Boolean)
                .forEach(function (value) {
                    const exists = Array.from(
                        listEl.querySelectorAll('.profile-chip-edit')
                    ).some(function (chip) {
                        return chip.dataset.value.toLowerCase() === value.toLowerCase();
                    });

                    if (!exists) {
                        listEl.appendChild(makeEditableChip(kind, value));
                    }
                });
        }

        function populateEditableList(key, values) {
            const modal = getModalBackdrop();
            const listEl = modal?.querySelector(`[data-edit-list="${key}"]`);

            if (!listEl) return;

            listEl.replaceChildren();

            cleanProfileList(values).forEach(function (value) {
                addEditableValues(listEl, value);
            });
        }

        function populateProfileModal() {
            const modal = getModalBackdrop();
            if (!modal) return;

            const profile = readProfileFromCard();

            populateEditableList('likes', profile.likes);
            populateEditableList('dislikes', profile.dislikes);

            const transportationInput = modal.querySelector('[data-edit-transportation]');
            if (transportationInput) transportationInput.value = profile.transportation || '';
        }

        function flushTypedAddInputs() {
            const modal = getModalBackdrop();
            if (!modal) return;

            modal.querySelectorAll('[data-edit-add-input]').forEach(function (input) {
                const value = input.value.trim();
                if (!value) return;

                const field = input.closest('.profile-edit-field');
                const listEl = field?.querySelector('[data-edit-list]');

                addEditableValues(listEl, value);
                input.value = '';
            });
        }

        function readListFromModal(key) {
            const modal = getModalBackdrop();
            const listEl = modal?.querySelector(`[data-edit-list="${key}"]`);

            if (!listEl) return [];

            return cleanProfileList(
                Array.from(listEl.querySelectorAll('.profile-chip-edit'))
                    .map(function (chip) {
                        return chip.dataset.value;
                    })
            );
        }

        function readProfileFromModal() {
            const modal = getModalBackdrop();

            flushTypedAddInputs();

            const existing = readProfileFromCard();
            const card = getProfileCard();
            const target = card?.dataset.matchTarget || 'programs';
            const transportationInput =
                modal?.querySelector('[data-edit-transportation]');

            return {
                name: existing.name,
                likes: readListFromModal('likes'),
                dislikes: readListFromModal('dislikes'),
                transportation: target === 'opportunities'
                    ? String(transportationInput?.value || '').trim()
                    : ''
            };
        }

        function getFocusableElements() {
            const dialog = getModalDialog();
            if (!dialog) return [];

            return Array.from(dialog.querySelectorAll(focusableSelector))
                .filter(function (el) {
                    return !el.disabled && el.offsetParent !== null;
                });
        }

        function moveModalToBody() {
            const backdrop = getModalBackdrop();

            if (backdrop && backdrop.parentElement !== document.body) {
                document.body.appendChild(backdrop);
            }
        }

        function inertBackground() {
            const backdrop = getModalBackdrop();
            if (!backdrop) return;

            inertedElements = Array.from(document.body.children)
                .filter(function (el) {
                    return el !== backdrop;
                })
                .map(function (el) {
                    return {
                        el: el,
                        inert: el.inert
                    };
                });

            inertedElements.forEach(function (item) {
                item.el.inert = true;
            });
        }

        function restoreBackground() {
            inertedElements.forEach(function (item) {
                item.el.inert = item.inert;
            });

            inertedElements = [];
        }

        function openProfileModal(trigger) {
            const backdrop = getModalBackdrop();
            const dialog = getModalDialog();

            if (!backdrop || !dialog) return;

            lastModalTrigger = trigger || document.activeElement;

            moveModalToBody();
            populateProfileModal();

            backdrop.hidden = false;
            document.body.classList.add('profile-modal-open');

            dialog.focus({ preventScroll: true });

            inertBackground();
        }

        function closeProfileModal() {
            const backdrop = getModalBackdrop();

            if (!backdrop || backdrop.hidden) return;

            backdrop.hidden = true;
            document.body.classList.remove('profile-modal-open');

            restoreBackground();

            if (lastModalTrigger && typeof lastModalTrigger.focus === 'function') {
                lastModalTrigger.focus({ preventScroll: true });
            }

            lastModalTrigger = null;
        }

        async function saveProfileModal() {
            const profile = readProfileFromModal();
            const chatStatus = getChatStatus();
            const saveButton =
                getModalBackdrop()?.querySelector('[data-profile-save]');

            if (saveButton) {
                saveButton.disabled = true;
                saveButton.textContent = 'Saving…';
            }

            try {
                /*
                  * On a matches page, rebuild the results URL for the current
                    * match target and navigate to it.
                    *
                    * The updated profile will be synchronized into Tyler's context if the
                    * user later follows the updated Back to conversation link.
                 */
                if (shouldRedirectAfterProfileSave()) {
                    renderProfileCard(profile);
                    closeProfileModal();

                    const card = getProfileCard();
                    const target = card?.dataset.matchTarget || 'programs';
                    const demo = card?.dataset.demo === 'true';

                    window.location.assign(
                        buildMatchesUrl(profile, target, demo)
                    );

                    return;
                }

                /*
                 * On the chat page, persist the edited profile into the server-side
                 * session before changing the visible profile card.
                 */
                const response = await fetch('/chat/profile', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(profile)
                });

                if (!response.ok) {
                    throw new Error(
                        `Profile save failed with status ${response.status}`
                    );
                }

                renderProfileCard(profile);
                closeProfileModal();

                /*
                 * This is announced through the visually hidden status region.
                 * It does not add a Tyler message to the transcript.
                 */
                if (chatStatus) {
                    chatStatus.textContent = 'Profile changes saved.';
                }
            } catch (error) {
                console.error('Unable to save profile changes:', error);

                if (chatStatus) {
                    chatStatus.textContent =
                        'The profile changes could not be saved. Please try again.';
                }
            } finally {
                if (saveButton) {
                    saveButton.disabled = false;
                    saveButton.textContent = 'Save changes';
                }
            }
        }

        document.addEventListener('click', function (event) {
            const openButton = event.target.closest('[data-profile-edit-open]');
            if (openButton) {
                openProfileModal(openButton);
                return;
            }

            if (event.target.closest('[data-profile-modal-close]')) {
                closeProfileModal();
                return;
            }

            if (event.target.closest('[data-profile-save]')) {
                void saveProfileModal();
                return;
            }

            const addButton = event.target.closest('[data-edit-add-button]');
            if (addButton) {
                const field = addButton.closest('.profile-edit-field');
                const input = field?.querySelector('[data-edit-add-input]');
                const listEl = field?.querySelector('[data-edit-list]');

                if (input) {
                    addEditableValues(listEl, input.value);
                    input.value = '';
                    input.focus();
                }

                return;
            }

            const removeButton = event.target.closest('[data-edit-remove]');
            if (removeButton) {
                removeButton.closest('.profile-chip-edit')?.remove();
                return;
            }

            if (event.target.matches('[data-profile-edit-modal]')) {
                closeProfileModal();
            }
        });

        document.addEventListener('keydown', function (event) {
            const backdrop = getModalBackdrop();
            const modalIsOpen = backdrop && !backdrop.hidden;

            if (event.key === 'Enter' && event.target.matches('[data-edit-add-input]')) {
                event.preventDefault();

                const field = event.target.closest('.profile-edit-field');
                const listEl = field?.querySelector('[data-edit-list]');

                addEditableValues(listEl, event.target.value);
                event.target.value = '';
                return;
            }

            if (!modalIsOpen) return;

            if (event.key === 'Escape') {
                event.preventDefault();
                closeProfileModal();
                return;
            }

            if (event.key !== 'Tab') return;

            const focusable = getFocusableElements();

            if (!focusable.length) {
                event.preventDefault();
                getModalDialog()?.focus();
                return;
            }

            const first = focusable[0];
            const last = focusable[focusable.length - 1];

            if (event.shiftKey && document.activeElement === first) {
                event.preventDefault();
                last.focus();
                return;
            }

            if (!event.shiftKey && document.activeElement === last) {
                event.preventDefault();
                first.focus();
            }
        });
    })();
</script>
