<div id="saved-header-slot" class="saved-header-slot" {% if saved_header_oob|default(false) %} hx-swap-oob="outerHTML"
    {% endif %}>
    {% if saved_total_count > 0 %}
    <span class="saved-nav-status" aria-label="
      {%- if active_saved_count > 0 -%}
        Saved opportunities: {{ active_saved_count }} currently available
      {%- else -%}
        Saved opportunities
      {%- endif -%}
    ">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
            <path d="M6 4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21l-6-3.5L6 21V4.5Z" stroke="currentColor"
                stroke-width="1.8" stroke-linejoin="round" />
        </svg>

        <span class="saved-nav-status__label">Saved</span>

        {% if active_saved_count > 0 %}
        <span class="saved-nav-status__count" aria-hidden="true">
            {{ active_saved_count }}
        </span>
        {% endif %}
    </span>
    {% endif %}
</div>
