<div id="saved-header-slot" class="saved-header-slot" {% if saved_header_oob|default(false) %} hx-swap-oob="outerHTML"
  {% endif %}>
  {% if saved_total_count > 0 %}

  <a href="/saved"
    class="saved-nav-status{% if saved_header_active|default(false) %} saved-nav-status--active{% endif %}" {% if
    saved_header_active|default(false) %} aria-current="page" {% endif %}>
    <svg viewBox="0 0 24 24" fill="{% if saved_header_active|default(false) %}currentColor{% else %}none{% endif %}"
      aria-hidden="true" focusable="false">
      <path d="M6 4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21l-6-3.5L6 21V4.5Z" stroke="currentColor"
        stroke-width="2" stroke-linejoin="round" />
    </svg>

    <span class="saved-nav-status__label">
      Saved
    </span>

    {% if active_saved_count > 0 %}
    <span class="saved-nav-status__count">
      {{ active_saved_count }}
    </span>
    {% endif %}
  </a>

  {% endif %}
</div>
