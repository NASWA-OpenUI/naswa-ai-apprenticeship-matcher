{% macro modal(
name,
title,
description=None,
dialog_class="",
backdrop_class="",
attrs=None
) %}

<div class="modal-backdrop{% if backdrop_class %} {{ backdrop_class }}{% endif %}" data-modal="{{ name }}" {% if attrs
    %} {% for key, value in attrs.items() %} {{ key }}="{{ value }}" {% endfor %} {% endif %} hidden>
    <div class="modal{% if dialog_class %} {{ dialog_class }}{% endif %}" data-modal-dialog role="dialog"
        aria-modal="true" aria-labelledby="{{ name }}-title" {% if description %}
        aria-describedby="{{ name }}-description" {% endif %} tabindex="-1">
        <div class="modal-head">
            <div>
                <h2 id="{{ name }}-title">
                    {{ title }}
                </h2>

                {% if description %}
                <p id="{{ name }}-description">
                    {{ description }}
                </p>
                {% endif %}
            </div>

            <button type="button" class="modal-close" data-modal-close aria-label="Close">
                ×
            </button>
        </div>

        {{ caller() }}
    </div>
</div>

{% endmacro %}
