{% from "_modal.html" import modal %}

{% call modal(
"opportunity-email",
"Email this to yourself",
"We will send you the details of this apprenticeship so you can find it again later.",
dialog_class="opportunity-email-modal"
) %}

{% include "_opportunity_email_form.html" %}

{% endcall %}

<script>
    (function () {
        const modal = document.querySelector(
            '[data-modal="opportunity-email"]'
        );

        if (!modal) return;

        const initialState =
            modal
                .querySelector(
                    '#opportunity-email-state'
                )
                ?.outerHTML || '';

        modal.addEventListener(
            'modal:closed',
            function () {
                const currentState =
                    modal.querySelector(
                        '#opportunity-email-state'
                    );

                if (
                    !currentState ||
                    !initialState
                ) {
                    return;
                }

                currentState.outerHTML =
                    initialState;

                const restoredState =
                    modal.querySelector(
                        '#opportunity-email-state'
                    );

                if (
                    restoredState &&
                    window.htmx
                ) {
                    window.htmx.process(
                        restoredState
                    );
                }
            }
        );

        document.body.addEventListener(
            'htmx:afterSwap',
            function (event) {
                if (
                    event.detail.target?.id !==
                    'opportunity-email-state'
                ) {
                    return;
                }

                const invalidInput =
                    modal.querySelector(
                        '[aria-invalid="true"]'
                    );

                if (invalidInput) {
                    invalidInput.focus();
                    return;
                }

                modal
                    .querySelector(
                        '[data-modal-close-done]'
                    )
                    ?.focus();
            }
        );
    })();
</script>
